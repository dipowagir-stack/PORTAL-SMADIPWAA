name: Build and Deploy to cPanel

on:
  push:
    branches: [ main, master ] # Sesuaikan dengan nama branch utama Anda (main atau master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' # Sesuaikan versi Node.js Anda jika diperlukan

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-files
        path: dist/ # Folder hasil build Anda (bisa diganti build/ jika proyek Anda menggunakan folder build)
